# Copy this block into C:\xampp\apache\conf\extra\httpd-vhosts.conf on the school server.
# Change C:/OFPPT-Attendance only if you installed the project in another folder.

<VirtualHost *:80>
    ServerName ofppt-attendance.local
    DocumentRoot "C:/OFPPT-Attendance/backend/public"

    <Directory "C:/OFPPT-Attendance/backend/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/ofppt-attendance-error.log"
    CustomLog "logs/ofppt-attendance-access.log" combined
</VirtualHost>
